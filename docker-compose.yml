services:
  vrp:
    build: .
    image: ortools-vrp:local
    ports:
      - "8000:8000"
    environment:
      VRP_LOG_LEVEL: INFO
      VRP_JOB_WORKERS: "2"
      # VRP_API_KEY: change-me
      # VRP_OSRM_BASE_URL: http://osrm:5000
    # 也可将这些变量放入 .env 并取消以下注释：
    # env_file:
    #   - .env
    restart: unless-stopped
